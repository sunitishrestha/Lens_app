services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: joblens
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: joblens_dev_password
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
